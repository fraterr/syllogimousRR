<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Syllogimous RR</title>
    <meta name="description" content="Relational reasoning trainer: distinction, comparison, time, syllogisms, space, analogies and logic.">
    <meta name="theme-color" content="#2F6F6A">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <a class="skip" href="#main">Skip to main content</a>
    <header class="topbar">
        <div class="topbar__inner">
            <div class="brand">
                <span class="brand__mark" aria-hidden="true"></span>
                <span class="brand__text"><span class="brand__name">Syllogimous RR</span><span class="brand__tag">Relational reasoning trainer</span></span>
            </div>
            <nav aria-label="Main">
                <ul class="nav">
                    <li><button type="button" data-view="train" aria-current="page">Train</button></li>
                    <li><button type="button" data-view="progress">Progress</button></li>
                    <li><button type="button" data-view="history">History</button></li>
                    <li><button type="button" data-view="settings">Settings</button></li>
                    <li><button type="button" data-view="about">About</button></li>
                </ul>
            </nav>
            <button type="button" class="theme-toggle" aria-pressed="false">
                <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
                <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <span class="theme-toggle__text"></span>
            </button>
        </div>
    </header>

    <main id="main" tabindex="-1">
        <section id="view-train" class="view">
            <h1 class="sr-only">Train</h1>
            <div class="bench-banner notice" hidden>
                <span class="bench-banner__text"></span>
                <button type="button" class="btn btn--small bench-abort"></button>
            </div>

            <div class="train-grid">
                <div class="train-side">
                    <div class="side-block side-block--type">
                        <span class="eyebrow label--category"></span>
                        <span class="question__type" id="q-type"></span>
                        <span class="question__subtype"></span>
                    </div>
                    <div class="side-block side-block--level">
                        <span class="eyebrow label--level"></span>
                        <span class="question__level"></span>
                    </div>
                    <div class="stats">
                        <div class="stat stat--score"><span class="stat__label eyebrow"></span><span class="stat__value"></span></div>
                        <div class="stat stat--acc"><span class="stat__label eyebrow"></span><span class="stat__value"></span></div>
                        <div class="stat stat--session"><span class="stat__label eyebrow"></span><span class="stat__value"></span></div>
                        <div class="stat stat--week"><span class="stat__label eyebrow"></span><span class="stat__value"></span></div>
                    </div>
                    <div class="program-block" hidden>
                        <span class="eyebrow program-block__title"></span>
                        <p class="program-block__desc small"></p>
                        <button type="button" class="btn btn--small program-bench" hidden></button>
                    </div>
                    <button type="button" class="btn btn--small end-session" hidden></button>
                </div>

                <article class="question" aria-labelledby="q-type">
                    <p class="question__empty" hidden></p>
                    <div class="question__body">
                        <div class="timer" role="progressbar" aria-valuemin="0" hidden>
                            <div class="timer__track"><div class="timer__bar"></div></div>
                            <span class="timer__text" aria-hidden="true"></span>
                        </div>
                        <div class="question__text">
                            <p class="neg-reminder" hidden></p>
                            <h2 class="eyebrow label--premises"></h2>
                            <ol class="premises"></ol>
                            <div class="stepper" hidden>
                                <button type="button" class="btn btn--small step-prev"></button>
                                <span class="step-counter" aria-live="polite"></span>
                                <button type="button" class="btn btn--small step-next"></button>
                            </div>
                            <div class="reveal" hidden>
                            <button type="button" class="btn btn--primary reveal-btn"><span class="reveal-btn__text"></span><span class="kbd" aria-hidden="true">↓</span></button>
                        </div>
                        <div class="conclusion-block">
                                <div class="conclusion-box">
                                    <h2 class="eyebrow label--conclusion"></h2>
                                    <div class="conclusion"></div>
                                </div>
                                <p class="legend small" hidden></p>
                                <p class="question__prompt"></p>
                                <div class="answers">
                                    <button type="button" class="btn btn--answer btn--true"><span class="btn__text"></span><span class="kbd" aria-hidden="true"></span></button>
                                    <button type="button" class="btn btn--answer btn--false"><span class="btn__text"></span><span class="kbd" aria-hidden="true"></span></button>
                                </div>
                            </div>
                        </div>
                        <div class="sorting-host" hidden></div>
                    </div>
                </article>
            </div>

            <div class="feedback" hidden aria-live="off"></div>
            <p class="keys muted small"></p>
        </section>

        <section id="view-progress" class="view" hidden></section>
        <section id="view-history" class="view" hidden></section>
        <section id="view-settings" class="view" hidden></section>
        <section id="view-about" class="view" hidden></section>
    </main>

    <dialog id="summary" aria-labelledby="summary-title"></dialog>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <footer class="footer">
        <p class="credits small muted"></p>
    </footer>
</body>
</html>
